<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>kconnect — simple GUI</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 20px; }
    fieldset { border: 1px solid #ccc; padding: 12px; margin-bottom: 16px; }
    legend { font-weight: 700; }
    label { display: inline-block; min-width: 160px; }
    .row { margin: 6px 0; }
    .note { color: #555; font-size: 0.92em; }
    .btn { padding: 8px 14px; border: 1px solid #333; background: #fafafa; cursor: pointer; }
    .btn:hover { background: #eee; }
    select, input[type="text"], input[type="number"] { padding: 4px 6px; min-width: 200px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hide { display:none; }
  </style>
</head>
<body>
  
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul style="color: #b00;">
        {% for m in messages %}<li>{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="post" enctype="multipart/form-data" onsubmit="return finalizeGraphId();">
    <fieldset>
      <legend>Algorithm</legend>
      <div class="row">
        <label for="algo">Algo</label>
        <select id="algo" name="algo">
          <option value="k3-local">k3-local</option>
          <option value="k2-sim">k2-sim</option>
          <option value="k2-st">k2-st</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Graph source</legend>
      <div class="row">
        <label>Source</label>
        <label><input type="radio" name="source" value="catalog" checked onclick="toggleSource()"> Catalog</label>
        <label style="margin-left:10px;"><input type="radio" name="source" value="yaml" onclick="toggleSource()"> YAML</label>
      </div>

      <div id="catalogPane">
        <div class="row">
          <label for="catalog">Catalog</label>
          <select id="catalog" name="catalog" onchange="showFamily();">
            <option value="k3">k3</option>
            <option value="k2">k2</option>
          </select>
        </div>

        <div id="k2Families">
          <div class="row">
            <label for="k2family">Family</label>
            <select id="k2family" onchange="updateK2Fields()">
              <option value="cycle">cycle(n)</option>
              <option value="ladder">ladder(n)</option>
              <option value="circ_ladder">circ_ladder(n)</option>
              <option value="hubring">hubring(n)</option>
              <option value="torus">torus(m x n)</option>
            </select>
          </div>
          <div class="cols">
            <div class="row"><label for="k2n">n</label><input type="number" id="k2n" min="3" value="12"/></div>
            <div class="row"><label for="k2m">m (for torus)</label><input type="number" id="k2m" min="3" value="4"/></div>
            <div class="row"><label for="k2n2">n (for torus)</label><input type="number" id="k2n2" min="3" value="5"/></div>
          </div>
        </div>

        <div id="k3Families" class="hide">
          <div class="row">
            <label for="k3family">Family</label>
            <select id="k3family" onchange="updateK3Fields()">
              <option value="K4">K4 (fixed)</option>
              <option value="complete">complete(N)</option>
              <option value="wheel">wheel(N)</option>
              <option value="prism">prism(N)</option>
              <option value="hypercube_d">hypercube_d(D)</option>
              <option value="Kmxn">K(m x n)</option>
              
              <option value="octahedron">octahedron</option>
              <option value="icosahedron">icosahedron</option>
              <option value="dodecahedron">dodecahedron</option>
              <option value="cubical">cubical</option>
              
            </select>
          </div>
          <div class="cols">
            <div class="row" id="row_k3N"><label for="k3N">N / D</label><input type="number" id="k3N" min="3" value="12"/></div>
            <div class="row" id="row_k3M"><label for="k3M">m (Kmxn)</label><input type="number" id="k3M" min="3" value="3"/></div>
            <div class="row" id="row_k3K"><label for="k3K">n OR k</label><input type="number" id="k3K" min="3" value="8"/></div>
          </div>
        </div>

        <input type="hidden" id="graph_id" name="graph_id" value="K4"/>
      </div>

      <div id="yamlPane" class="hide">
        <div class="row">
          <label for="yamlfile">YAML file</label>
          <input type="file" id="yamlfile" name="yamlfile" accept=".yaml,.yml"/>
        </div>
        <div class="row note">Anchors must be present in the YAML.</div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Weights & options</legend>
      <div class="row">
        <label for="weights">Weights</label>
        <select id="weights" name="weights">
          <option value="yaml">yaml (use weights from YAML; catalogs fallback to default)</option>
          <option value="default" selected>default (anchors equal ±1; others adjusted so Σ=0)</option>
          <option value="random">random (zero-sum, anchor sign enforced)</option>
          <option value="binary">binary ±1 (requires even |V| and 2*anchors <= |V|)</option>
        </select>
      </div>
      <div class="row">
        <label for="anchor_sign">Anchor sign</label>
        <select id="anchor_sign" name="anchor_sign">
          <option value="negative">negative</option>
          <option value="positive">positive</option>
        </select>
      </div>
      <div class="row">
        <label for="seed">Random seed</label>
        <input type="number" id="seed" name="seed" value="7"/>
      </div>
      <div class="row">
        <label>Visuals</label>
        <label><input type="checkbox" name="viz" checked> Save frames</label>
        <label style="margin-left:12px;"><input type="checkbox" name="gif" checked> Make GIF</label>
        <label style="margin-left:12px;"><input type="checkbox" name="debug"> Debug log</label>
      </div>
    </fieldset>

    <button class="btn" type="submit">Run</button>
  </form>

<script>
function toggleSource(){
  const src = [...document.getElementsByName('source')].find(r=>r.checked).value;
  document.getElementById('catalogPane').classList.toggle('hide', src !== 'catalog');
  document.getElementById('yamlPane').classList.toggle('hide', src !== 'yaml');
  updateWeightFeasibility();
}

function showFamily(){
  const cat = document.getElementById('catalog').value;
  document.getElementById('k2Families').classList.toggle('hide', cat !== 'k2');
  document.getElementById('k3Families').classList.toggle('hide', cat !== 'k3');
  updateParamVisibility();
  updateWeightFeasibility();
}

function updateParamVisibility(){
  const cat = document.getElementById('catalog').value;
  if(cat === 'k2'){
    // k2 families all parametric
  } else {
    const fam = document.getElementById('k3family').value;
    const fixed = new Set(['K4','octahedron','icosahedron','dodecahedron','cubical','theta343']);
    const needN = new Set(['complete','wheel','prism','hypercube_d']);
    const needMN = new Set(['Kmxn']);
    const needNK = new Set(['gp']);
    document.getElementById('row_k3N').style.display='none';
    document.getElementById('row_k3M').style.display='none';
    document.getElementById('row_k3K').style.display='none';
    if (fixed.has(fam)) {
    } else if (needN.has(fam)) {
      document.getElementById('row_k3N').style.display='block';
    } else if (needMN.has(fam)) {
      document.getElementById('row_k3M').style.display='block';
      document.getElementById('row_k3K').style.display='block';
    } else if (needNK.has(fam)) {
      document.getElementById('row_k3N').style.display='block';
      document.getElementById('row_k3K').style.display='block';
    }
  }
}

function graphSizeAndAnchors(){
  const cat = document.getElementById('catalog').value;
  let N = 0, k = (cat==='k2'?2:3);
  if(cat === 'k2'){
    const fam = document.getElementById('k2family').value;
    const n = parseInt(document.getElementById('k2n').value||'12',10);
    const m = parseInt(document.getElementById('k2m').value||'4',10);
    const n2= parseInt(document.getElementById('k2n2').value||'5',10);
    if(fam==='cycle') N = n;
    else if(fam==='ladder') N = 2*n;
    else if(fam==='circ_ladder') N = 2*n;
    else if(fam==='hubring') N = n + 2;
    else if(fam==='torus') N = m*n2;
  } else {
    const fam = document.getElementById('k3family').value;
    const Nval = parseInt(document.getElementById('k3N').value||'12',10);
    const M = parseInt(document.getElementById('k3M').value||'3',10);
    const K = parseInt(document.getElementById('k3K').value||'8',10);
    if(fam==='K4') N = 4;
    else if(fam==='complete') N = Nval;
    else if(fam==='wheel') N = Nval;
    else if(fam==='prism') N = 2*Nval;
    else if(fam==='hypercube_d') N = Math.pow(2, Nval);
    else if(fam==='Kmxn') N = M + K;
    else if(fam==='gp') N = 2*Math.max(5, Nval);
    else if(fam==='octahedron') N = 6;
    else if(fam==='icosahedron') N = 12;
    else if(fam==='dodecahedron') N = 20;
    else if(fam==='cubical') N = 8;
    else if(fam==='theta343') N = 3 + (7-2)*3 + 1 + 3;
  }
  return {N, k};
}

function updateWeightFeasibility(){
  const sel = document.getElementById('weights');
  const {N, k} = graphSizeAndAnchors();
  const binaryOK = (N % 2 === 0) && (2*k <= N);
  for (const opt of sel.options) {
    if (opt.value === 'binary') {
      opt.disabled = !binaryOK;
      if (!binaryOK && sel.value === 'binary') sel.value = 'default';
      opt.text = 'binary ±1 (requires even |V| and 2*anchors <= |V|)';
    }
    if (opt.value === 'yaml') {
      const src = [...document.getElementsByName('source')].find(r=>r.checked).value;
      opt.disabled = (src === 'catalog');
      if (opt.disabled && sel.value === 'yaml') sel.value = 'default';
    }
  }
}

function updateK2Fields(){ updateWeightFeasibility(); }
function updateK3Fields(){ updateParamVisibility(); updateWeightFeasibility(); }

function finalizeGraphId(){
  const src = [...document.getElementsByName('source')].find(r=>r.checked).value;
  if(src === 'catalog'){
    const cat = document.getElementById('catalog').value;
    let gid = "K4";
    if(cat === 'k2'){
      const fam = document.getElementById('k2family').value;
      const n = parseInt(document.getElementById('k2n').value||'12',10);
      const m = parseInt(document.getElementById('k2m').value||'4',10);
      const n2= parseInt(document.getElementById('k2n2').value||'5',10);
      if(fam === 'cycle') gid = `cycle${n}`;
      else if(fam === 'ladder') gid = `ladder${n}`;
      else if(fam === 'circ_ladder') gid = `circ_ladder${n}`;
      else if(fam === 'hubring') gid = `hubring${n}`;
      else if(fam === 'torus') gid = `torus${m}x${n2}`;
    } else {
      const fam = document.getElementById('k3family').value;
      const N = parseInt(document.getElementById('k3N').value||'12',10);
      const M = parseInt(document.getElementById('k3M').value||'3',10);
      const K = parseInt(document.getElementById('k3K').value||'8',10);
      if(fam === 'K4') gid = 'K4';
      else if(fam === 'complete') gid = `complete${N}`;
      else if(fam === 'wheel') gid = `wheel${N}`;
      else if(fam === 'prism') gid = `prism${N}`;
      else if(fam === 'hypercube_d') gid = `hypercube_d${N}`;
      else if(fam === 'Kmxn') gid = `K${M}x${K}`;
      else if(fam === 'gp') {
        const n = Math.max(5, N);
        const kmax = Math.floor(n/2)-1;
        const kk = Math.max(1, Math.min(K, kmax));
        gid = `gp(${n},${kk})`;
      } else {
        gid = fam;
      }
    }
    document.getElementById('graph_id').value = gid;
  }
  return true;
}

window.addEventListener('DOMContentLoaded', ()=>{
  toggleSource(); showFamily(); updateParamVisibility(); updateWeightFeasibility();
});
</script>
